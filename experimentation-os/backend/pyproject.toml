[project]
name = "experimentos-backend"
version = "0.1.0"
description = "ExperimentOS API and workers"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.15,<2",
  "boto3>=1.37,<2",
  "cryptography>=44,<47",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "numpy==2.5.4",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.8,<3",
  "pyjwt>=2.10,<3",
  "scipy==1.18.1",
  "sqlalchemy>=2.0,<3",
  "statsmodels==0.15.0",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008", "S101"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501", "UP007", "UP035"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["jwt.*", "boto3.*", "botocore.*", "scipy.*", "statsmodels.*"]
ignore_missing_imports = true
