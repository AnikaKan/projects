name: experimentos

services:
  postgres:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_DB: experimentos
      POSTGRES_USER: experimentos
      POSTGRES_PASSWORD: experimentos
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U experimentos -d experimentos"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  localstack:
    image: localstack/localstack:4.14.0
    environment:
      SERVICES: sqs
      DEFAULT_REGION: us-west-2
      SQS_ENDPOINT_STRATEGY: path
    healthcheck:
      test: ["CMD", "awslocal", "sqs", "list-queues"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "4566:4566"

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment: &backend-environment
      EXPERIMENTOS_ENVIRONMENT: local
      AUTH_MODE: local
      DATABASE_URL: postgresql+psycopg://experimentos:experimentos@postgres:5432/experimentos
      CREDENTIAL_PEPPER: local-compose-pepper-not-for-managed-use-0001
      AWS_REGION: us-west-2
      SQS_ENDPOINT_URL: http://localstack:4566
      EVENT_QUEUE_NAME: experimentos-events
      EVENT_DLQ_NAME: experimentos-events-dlq
      AWS_EC2_METADATA_DISABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy

  seed-demo:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.local_seed"]
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully

  queue-bootstrap:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.queue_bootstrap"]
    environment: *backend-environment
    depends_on:
      localstack:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *backend-environment
    depends_on:
      seed-demo:
        condition: service_completed_successfully
      queue-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "8000:8000"

  ingestion-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.workers.ingestion"]
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      queue-bootstrap:
        condition: service_completed_successfully

  analysis-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.workers.analysis"]
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully

  console:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      API_BASE_URL: http://api:8000
      LOCAL_OPERATOR_SUBJECT: portfolio-owner@example.test
      LOCAL_ORGANIZATION_ID: 00000000-0000-4000-8000-000000000001
      EXPERIMENTOS_PROJECT_ID: 00000000-0000-4000-8000-000000000002
      EXPERIMENTOS_ENVIRONMENT_ID: 00000000-0000-4000-8000-000000000003
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

  host-app:
    build:
      context: .
      dockerfile: examples/host-app/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      EXPERIMENTOS_API_URL: http://api:8000
      EXPERIMENTOS_SERVICE_CREDENTIAL: ${EXPERIMENTOS_SERVICE_CREDENTIAL:-}
      EXPERIMENTOS_PROJECT_ID: 00000000-0000-4000-8000-000000000002
      EXPERIMENTOS_ENVIRONMENT_ID: 00000000-0000-4000-8000-000000000003
      EXPERIMENTOS_EXPERIMENT_KEY: ${EXPERIMENTOS_EXPERIMENT_KEY:-signup-message}
      DEMO_SUBJECT_ID: ${DEMO_SUBJECT_ID:-visitor-1001}
      DEMO_MARKET: ${DEMO_MARKET:-US}
      EXPERIMENTOS_OUTBOX_DIRECTORY: /var/lib/experimentos-outbox
    volumes:
      - host-outbox:/var/lib/experimentos-outbox
    ports:
      - "3100:3100"

volumes:
  postgres-data:
  host-outbox:

